name: Bug report
description: Report a reproducible problem with ChatGPT Prompt Shortcut Finder
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Please provide enough information to reproduce the issue.
        Do not include passwords, API keys, tokens, cookies or other private data.

  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Python 3.12"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Application startup
        - Command search
        - Ranking / recommendations
        - Filters
        - Command combinations
        - Command library
        - Export
        - Streamlit interface
        - Installation / dependencies
        - Tests / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: Explain what happened and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the application
        2. Enter ...
        3. Select ...
        4. Error occurs
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Remove any private or sensitive information.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am using the latest available version.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private or sensitive information from this report.
          required: true
